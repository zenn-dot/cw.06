<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-slate-500 flex justify-center items-center min-h-screen p-5">

<div class="bg-white rounded-xl flex flex-col md:flex-row 
            w-full max-w-[800px] overflow-hidden">

  <!-- TEXT -->
  <div class="flex flex-col p-6 md:p-10 w-full md:w-1/2">
    <h1 class="font-bold text-3xl text-left">Stay updated!</h1>

    <p class="mt-5">Join 60,000+ product managers receiving monthly</p>
    <p class="mb-3">updates on:</p>

    <div class="flex gap-2">
      <img src="icon-list.svg">
      <p>Product discovery and building what matters</p>  
    </div>

    <div class="flex gap-2 mt-2">
      <img src="icon-list.svg">
      <p>Measuring to ensure updates are a success</p>  
    </div>

    <div class="flex gap-2 mt-2">
      <img src="icon-list.svg">
      <p>And much more!</p>  
    </div>

    <p class="font-bold mt-5 mb-2">Email address</p>

    <input 
      type="email" 
      placeholder="email@company.com"
      class="border rounded-sm p-3 w-full outline-none"
    >

    <button class="bg-blue-950 rounded-sm mt-4 w-full p-3 text-white">
      Subscribe to monthly newsletter
    </button>
  </div>
  
  <!-- IMAGE -->
  <div class="w-full md:w-1/2 h-64 md:h-auto">
    <img src="photo.svg" class="w-full h-full object-cover md:rounded-r-xl">
  </div>

</div>

</body>
</html>
