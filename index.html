<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

<div id="container">

  <div id="left">
    <h1>Stay updated!</h1>

    <p>Join 60,000+ product managers receiving monthly</p>
    <p>updates on:</p>

    <p>Product discovery and building what matters</p>
    <p>Measuring to ensure updates are a success</p>
    <p>And much more!</p>

    <p>Email address</p>

    <input type="email" placeholder="email@company.com">

    <button>Subscribe to monthly newsletter</button>
  </div>

  <div id="right">
    <img src="photo.svg">
  </div>

</div>

<script>
  window.onload = function () {

  let body = document.body;
  let container = document.getElementById("container");
  let left = document.getElementById("left");
  let right = document.getElementById("right");
  let button = document.querySelector("button");
  let input = document.querySelector("input");
  let img = document.querySelector("img");

  body.style.backgroundColor = "#64748b";
  body.style.display = "flex";
  body.style.justifyContent = "center";
  body.style.alignItems = "center";
  body.style.height = "100vh";
  body.style.margin = "0";

  container.style.backgroundColor = "white";
  container.style.display = "flex";
  container.style.width = "800px";
  container.style.borderRadius = "15px";
  container.style.overflow = "hidden";

  left.style.padding = "30px";
  left.style.width = "50%";

  right.style.width = "50%";

  img.style.width = "100%";
  img.style.height = "100%";
  img.style.objectFit = "cover";


  let h1 = document.querySelector("h1");
  h1.style.fontSize = "30px";


  input.style.width = "100%";
  input.style.padding = "10px";
  input.style.marginTop = "10px";
  input.style.border = "1px solid gray";
  input.style.borderRadius = "5px";


  button.style.width = "100%";
  button.style.padding = "12px";
  button.style.marginTop = "15px";
  button.style.backgroundColor = "#020617";
  button.style.color = "white";
  button.style.border = "none";
  button.style.borderRadius = "5px";
  button.style.cursor = "pointer";


  button.onmouseover = () => button.style.backgroundColor = "#1e293b";
  button.onmouseout = () => button.style.backgroundColor = "#020617";

};
</script>



</body>
</html>
