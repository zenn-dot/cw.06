<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-slate-500 flex justify-center items-center mt-50">

<div class="bg-white rounded-xl flex  justify-center item-center  w-[800px] h-[460px] gap-3 ">
<div class="flex flex-col p-10 ">
  <h1 class="font-bold text-3xl text-left">Stay updated!</h1>
<p class="mt-5 ">Join 60,000+ product managers receiving monthly</p>
<p class="mb-3">updates on:</p>

<div class="flex justify-start gap-2">
  <img src="icon-list.svg">
  <p class="">Product discovery and building what matters</p>  
</div>

<div class="flex justify-start gap-2 mt-2">
  <img src="icon-list.svg">
  <p>Measuring to ensure updates are a success</p>  
</div>

<div class="flex justify-start gap-2 mt-2">
  <img src="icon-list.svg">
  <p>And much more!</p>  
</div>

<p class="font-bold mt-5 mb-2">Email address</p>
 <button class="outline outline-offset-2 rounded-sm p-2  text-left w-[400px]" ><p class="text-slate-400">email@company.com</p></button>
 <button class="bg-blue-950 rounded-sm mt-4 w-[400px] mb-10 p-3"><span class="text-white">Subscribe to monthly newsletter</span></button>
</div>
  
<div class="w-[400px] mt-3 mb-3 mr-3">
  <img src="photo.svg" class="w-full h-full object-cover rounded-xl">
</div>

</div>
   
</body>
</html>
